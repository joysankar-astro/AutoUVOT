<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>SWIFT UVOT Job Submission</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
    </head>
    <body class="bg-light">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h3 class="card-title mb-4">Submit RA and DEC</h3>
                            <form id="raDecForm">
                                <div class="mb-3">
                                    <label for="ra" class="form-label"
                                        >RA (deg)</label
                                    >
                                    <input
                                        type="text"
                                        class="form-control"
                                        id="ra"
                                        name="ra"
                                        required
                                    />
                                </div>
                                <div class="mb-3">
                                    <label for="dec" class="form-label"
                                        >DEC (deg)</label
                                    >
                                    <input
                                        type="text"
                                        class="form-control"
                                        id="dec"
                                        name="dec"
                                        required
                                    />
                                </div>
                                <button
                                    type="submit"
                                    class="btn btn-primary w-100"
                                >
                                    Submit
                                </button>
                            </form>
                            <div id="status" class="mt-3"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            document
                .getElementById("raDecForm")
                .addEventListener("submit", async function (e) {
                    e.preventDefault(); // prevent default form submission

                    const ra = document.getElementById("ra").value;
                    const dec = document.getElementById("dec").value;

                    const statusDiv = document.getElementById("status");
                    statusDiv.innerHTML = "Submitting...";

                    try {
                        const response = await fetch("/api/start", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ ra: ra, dec: dec }),
                        });

                        const result = await response.json();

                        if (response.ok) {
                            statusDiv.innerHTML = `<div class="alert alert-success">Job started! Job ID: ${result.job_id}</div>`;
                            // Optionally redirect to results page
                            // window.location.href = `/result?job_id=${result.job_id}`;
                        } else {
                            statusDiv.innerHTML = `<div class="alert alert-danger">Error: ${result.error}</div>`;
                        }
                    } catch (err) {
                        statusDiv.innerHTML = `<div class="alert alert-danger">Network error: ${err}</div>`;
                    }
                });
        </script>
    </body>
</html>
