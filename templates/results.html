<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>UVOT Light Curve</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    </head>
    <body class="bg-light">
        <div class="container py-5">
            <h3 class="mb-4">Light Curve Viewer</h3>

            <!-- RA/DEC input form -->
            <div class="card mb-4 shadow-sm">
                <div class="card-body">
                    <form id="raDecForm">
                        <div class="row g-3">
                            <div class="col-md-5">
                                <input
                                    type="number"
                                    step="any"
                                    class="form-control"
                                    id="ra"
                                    placeholder="RA (deg)"
                                    required
                                />
                            </div>
                            <div class="col-md-5">
                                <input
                                    type="number"
                                    step="any"
                                    class="form-control"
                                    id="dec"
                                    placeholder="DEC (deg)"
                                    required
                                />
                            </div>
                            <div class="col-md-2">
                                <button
                                    type="submit"
                                    class="btn btn-primary w-100"
                                >
                                    Submit
                                </button>
                            </div>
                        </div>
                    </form>
                    <div id="status" class="mt-3"></div>
                </div>
            </div>

            <!-- Chart -->
            <div class="card shadow-sm">
                <div class="card-body">
                    <canvas id="lightCurveChart"></canvas>
                </div>
            </div>
        </div>

        <script>
            let chart = null;

            document
                .getElementById("raDecForm")
                .addEventListener("submit", async function (e) {
                    e.preventDefault();

                    const ra = document.getElementById("ra").value;
                    const dec = document.getElementById("dec").value;
                    const statusDiv = document.getElementById("status");
                    statusDiv.innerHTML = "Loading data...";

                    try {
                        const resp = await fetch(
                            `/api/result?ra=${ra}&dec=${dec}`,
                        );
                        const data = await resp.json();

                        if (!resp.ok) {
                            statusDiv.innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
                            return;
                        }

                        statusDiv.innerHTML = `<div class="alert alert-success">Data loaded: ${data.length} points</div>`;

                        // Group data by filter
                        const filters = [...new Set(data.map((d) => d.filter))];
                        const datasets = filters.map((f, idx) => {
                            const filterData = data.filter(
                                (d) => d.filter === f,
                            );
                            return {
                                label: f,
                                data: filterData.map((d) => ({
                                    x: d.obs_time,
                                    y: d.ab_mag,
                                    ab_mag_err: d.ab_mag_err,
                                })),
                                borderColor: `hsl(${idx * 60}, 70%, 50%)`,
                                backgroundColor: `hsl(${idx * 60}, 70%, 50%)`,
                                showLine: false,
                                fill: false,
                                tension: 0.2,
                                pointRadius: 4,
                            };
                        });

                        const ctx = document
                            .getElementById("lightCurveChart")
                            .getContext("2d");

                        if (chart) chart.destroy();

                        chart = new Chart(ctx, {
                            type: "scatter",
                            data: { datasets: datasets },
                            options: {
                                responsive: true,
                                plugins: {
                                    title: {
                                        display: true,
                                        text: `Light Curve for RA=${ra}, DEC=${dec}`,
                                    },
                                    tooltip: {
                                        callbacks: {
                                            label: function (context) {
                                                const d = context.raw;
                                                return `time=${d.x.toFixed(2)}, mag=${d.y.toFixed(2)} ± ${d.ab_mag_err.toFixed(2)}`;
                                            },
                                        },
                                    },
                                },
                                scales: {
                                    y: {
                                        reverse: true,
                                        title: {
                                            display: true,
                                            text: "AB Magnitude",
                                        },
                                    },
                                    x: {
                                        title: {
                                            display: true,
                                            text: "Observation Time (MJD)",
                                        },
                                    },
                                },
                            },
                        });
                    } catch (err) {
                        statusDiv.innerHTML = `<div class="alert alert-danger">Network error: ${err}</div>`;
                    }
                });
        </script>
    </body>
</html>
